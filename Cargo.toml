[package]
name = "lidarr-adapter"
version = "0.18.0"
edition = "2021"
rust-version = "1.95"
repository = "https://github.com/lemonfiber/plugin-lidarr"
authors = ["NightWorks.io"]
license-file = "LICENSE"
description = "Speaks lemonfiber's library.curate contract in front of Lidarr"
publish = false

[[bin]]
name = "lidarr-adapter"
path = "src/main.rs"

[dependencies]
adapter-kit-servarr = { git = "https://github.com/lemonfiber/adapter-kit-servarr", rev = "cc5584928d79e103c78326bc61417678d86bfdd8" }
async-trait = "0.1"
lemonfiber-adapter-kit = { git = "https://github.com/lemonfiber/lemonfiber", rev = "c0523e91c56bd5b4fdcf4de1c695f9a9a652e98b" }
lemonfiber-contract = { git = "https://github.com/lemonfiber/lemonfiber", rev = "c0523e91c56bd5b4fdcf4de1c695f9a9a652e98b" }
lemonfiber-ports = { git = "https://github.com/lemonfiber/lemonfiber", rev = "c0523e91c56bd5b4fdcf4de1c695f9a9a652e98b" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "time"] }

[dev-dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
lemonfiber-fixtures = { git = "https://github.com/lemonfiber/lemonfiber", rev = "c0523e91c56bd5b4fdcf4de1c695f9a9a652e98b" }
lemonfiber-plugin = { git = "https://github.com/lemonfiber/lemonfiber", rev = "c0523e91c56bd5b4fdcf4de1c695f9a9a652e98b" }
toml = "1.1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
pedantic = { level = "warn", priority = -1 }
duration_suboptimal_units = "allow"

[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
