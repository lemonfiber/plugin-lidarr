[package]
name = "lidarr-adapter"
version = "0.18.0"
edition = "2021"
rust-version = "1.95"
repository = "https://github.com/lemonfiber/plugin-lidarr"
authors = ["NightWorks.io"]
license-file = "LICENSE"
description = "Speaks lemonfiber's library.curate contract in front of Lidarr"
publish = false

[[bin]]
name = "lidarr-adapter"
path = "src/main.rs"

[dependencies]
adapter-kit-music = { git = "https://github.com/lemonfiber/adapter-kit-music", rev = "52505b9118cea2ad888376323e1ad64781c85a63" }
adapter-kit-servarr = { git = "https://github.com/lemonfiber/adapter-kit-servarr", rev = "71578363a3fe6584330afc45cfbba3b2ff25cfb5" }
async-trait = "0.1"
lemonfiber-adapter-kit = { git = "https://github.com/lemonfiber/lemonfiber", rev = "98bd419bed917ea8b3569dea33d7482bcd16eb7c" }
lemonfiber-contract = { git = "https://github.com/lemonfiber/lemonfiber", rev = "98bd419bed917ea8b3569dea33d7482bcd16eb7c" }
lemonfiber-ports = { git = "https://github.com/lemonfiber/lemonfiber", rev = "98bd419bed917ea8b3569dea33d7482bcd16eb7c" }
reqwest = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "time"] }

[build-dependencies]
toml = "1.1"

[dev-dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
lemonfiber-fixtures = { git = "https://github.com/lemonfiber/lemonfiber", rev = "98bd419bed917ea8b3569dea33d7482bcd16eb7c" }
lemonfiber-plugin = { git = "https://github.com/lemonfiber/lemonfiber", rev = "98bd419bed917ea8b3569dea33d7482bcd16eb7c" }
toml = "1.1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
pedantic = { level = "warn", priority = -1 }
duration_suboptimal_units = "allow"

[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
