[package]
name = "lidarr-adapter"
version = "0.18.0"
edition = "2021"
rust-version = "1.95"
repository = "https://github.com/lemonfiber/plugin-lidarr"
authors = ["NightWorks.io"]
license-file = "LICENSE"
description = "Speaks lemonfiber's library.curate contract in front of Lidarr"
publish = false

[[bin]]
name = "lidarr-adapter"
path = "src/main.rs"

[dependencies]
adapter-kit-music = { git = "https://github.com/lemonfiber/adapter-kit-music", rev = "8475d15dbd92749520bd4b6bea409111fb8ceb6d" }
adapter-kit-servarr = { git = "https://github.com/lemonfiber/adapter-kit-servarr", rev = "3d7c7c375e2bb154beb24c703403f67265f700e5" }
async-trait = "0.1"
lemonfiber-adapter-kit = { git = "https://github.com/lemonfiber/lemonfiber", rev = "13659f53d634c9d3ae05141706a9a910a1b3b614" }
lemonfiber-contract = { git = "https://github.com/lemonfiber/lemonfiber", rev = "13659f53d634c9d3ae05141706a9a910a1b3b614" }
lemonfiber-ports = { git = "https://github.com/lemonfiber/lemonfiber", rev = "13659f53d634c9d3ae05141706a9a910a1b3b614" }
reqwest = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "time"] }

[dev-dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
lemonfiber-fixtures = { git = "https://github.com/lemonfiber/lemonfiber", rev = "13659f53d634c9d3ae05141706a9a910a1b3b614" }
lemonfiber-plugin = { git = "https://github.com/lemonfiber/lemonfiber", rev = "13659f53d634c9d3ae05141706a9a910a1b3b614" }
toml = "1.1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
pedantic = { level = "warn", priority = -1 }
duration_suboptimal_units = "allow"

[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
