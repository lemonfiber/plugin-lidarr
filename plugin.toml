schema_version = 1

[plugin]
id          = "lidarr"
name        = "Lidarr"
version     = "1.0.0"
description = "Watches for music and fetches it"
without_it  = "Find and download music yourself"
upstream    = "https://github.com/Lidarr/Lidarr"
license     = "GPL-3.0-only"
forms       = ["music", "auto", "full"]

[[service]]
id          = "lidarr"
name        = "Lidarr"
image       = "lscr.io/linuxserver/lidarr"
digest      = "sha256:5e1235d00b5d1c1f60ca0d472e554a6611aef41aa7b5b6d88260214bf4809af0"
tag         = "2.14.5.4836-ls9"
port        = 8686
bind        = "loopback"
listens     = 8686
health      = { kind = "http", path = "/ping", timeout_s = 90 }
criticality = "core"
memory_mib  = 300
reaches     = "music metadata providers"
asks_for    = "Reads artist, album and track information for the music in your library."
takes_data  = true
user_mode   = "puid-env"
media_types = ["music"]
native      = "servarr"
replaces    = "lidarr"

[service.env]
LIDARR__AUTH__APIKEY = { secret = "upstream-key" }

[[service]]
id          = "lidarr-adapter"
name        = "Lidarr adapter"
image       = "ghcr.io/lemonfiber/lidarr-adapter"
digest      = "sha256:5edc56c76fe2ecb8475fb60100e3eec0fcf5b2723e8844c124093ecb05c60e52"
tag         = "main-eafa574f0f01"
criticality = "core"
reaches     = ""
asks_for    = "Nothing beyond this machine. It answers lemonfiber's library.curate contract by calling Lidarr, beside it, with the key lemonfiber minted for it."
config_path = "/config"
listens     = 8080
speaks      = ["library.curate@1"]
fronts      = "lidarr"
provides    = ["library.curate"]
upstream    = { api_key = { secret = "upstream-key" } }

[[secret]]
id     = "upstream-key"
of     = "lidarr"
minted = true
why    = "The key Lidarr answers its API to, which the adapter in front of it presents"

[[proof]]
id      = "lidarr.answers"
service = "lidarr"
title   = "Lidarr says it answers to anybody"
fixture = "recordings/lidarr/ping-answers.json"
why     = """
The adapter's readiness is this answer, which it asks without a key, so the
pinned image has to give it to a caller presenting nothing.
"""
request = { method = "GET", path = "/ping" }
expect  = { status = 200, json = { status = "OK" } }

[[proof]]
id      = "lidarr.guarded"
service = "lidarr"
title   = "Lidarr shows what it wants to nobody presenting nothing"
fixture = "recordings/lidarr/wanted-guarded.json"
why     = """
What Lidarr wants names what the household listens to. Only the adapter asks, with
the key lemonfiber minted, so a Lidarr that answered it to a caller presenting
nothing would be telling every device that can reach it.
"""
request = { method = "GET", path = "/api/v1/wanted/missing" }
expect  = { status = 401 }

[[ask]]
service    = "lidarr"
capability = "download.usenet"

[[ask]]
service    = "lidarr"
capability = "download.torrent"

[[ask]]
service    = "lidarr"
capability = "dashboard.show"
